name: Ops drills

# CI for the operator targets that `make` exposes but that are marked "not part
# of make check or default CI": the private-beta preparation harnesses. They run
# in their offline / simulate / dry-run modes, which need no staging host, and
# their evidence is validated with the same gate operators use.
#
# Running green here does not claim private-beta readiness. Live staging TLS,
# SMTP --send and target stress numbers stay operator work
# (docs/ops/private-beta-checklist.md).

on:
  push:
    branches:
      - main
    paths:
      - 'lib/GPForum/Command/StressLoad.pm'
      - 'lib/GPForum/Command/Mail*'
      - 'lib/GPForum/Command/DeadLetterCheck.pm'
      - 'lib/GPForum/Service/Operations/**'
      - 'lib/GPForum/Command/Staging*'
      - 'lib/GPForum/Command/Evidence*'
      - 'lib/GPForum/CLI/staging_*.pm'
      - 'bin/gpforum'
      - 'lib/GPForum/CLI/**'
      - 'script/gpforum-evidence-*'
      - 'script/gpforum-private-beta-checklist'
      - 'docs/ops/evidence/**'
      - '.github/workflows/ops-drills.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/GPForum/Command/StressLoad.pm'
      - 'lib/GPForum/Command/Mail*'
      - 'lib/GPForum/Command/DeadLetterCheck.pm'
      - 'lib/GPForum/Service/Operations/**'
      - 'lib/GPForum/Command/Staging*'
      - 'lib/GPForum/Command/Evidence*'
      - 'lib/GPForum/CLI/staging_*.pm'
      - 'bin/gpforum'
      - 'lib/GPForum/CLI/**'
      - 'script/gpforum-evidence-*'
      - 'script/gpforum-private-beta-checklist'
      - 'docs/ops/evidence/**'
      - '.github/workflows/ops-drills.yml'
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-drills-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  drills:
    name: Offline operator drills
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpforum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gpforum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GPFORUM_DATABASE_DSN: dbi:Pg:dbname=gpforum_test;host=127.0.0.1;port=5432
      GPFORUM_DATABASE_USER: postgres
      GPFORUM_DATABASE_PASSWORD: postgres
      GPFORUM_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      GPFORUM_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GPForum
        uses: ./.github/actions/setup-gpforum-perl
        with:
          postgres: 'true'
          postgres-client-version: '18'

      - name: Apply database migrations
        run: bin/gpforum migrate

      - name: Prepare the evidence directory
        run: mkdir -p artifacts

      - name: Rehearse backup and restore against PostgreSQL
        run: bin/gpforum staging-drill --json | tee artifacts/staging-drill.json

      - name: Rehearse attachment restore and deploy templates
        run: bin/gpforum staging-drill-attachments --json | tee artifacts/staging-drill-attachments.json

      - name: Verify staging host artifacts
        run: bin/gpforum staging-host-verify --json | tee artifacts/staging-host-verify.json

      - name: Probe the identity mail transport
        run: bin/gpforum mail-check --json --dry-run | tee artifacts/gpforum-mail-check-dry.json

      - name: Exercise the identity mail lifecycle
        run: bin/gpforum mail-lifecycle-check --json --simulate | tee artifacts/gpforum-mail-lifecycle-check.json

      - name: Exercise the dead-letter lifecycle
        run: bin/gpforum dead-letter-check --json --simulate | tee artifacts/gpforum-dead-letter-check.json

      - name: Plan the stress-load profiles
        run: |
          set -euo pipefail
          for profile in smoke 100 500 1000; do
            bin/gpforum stress-load --dry-run --profile "$profile" --json \
              | tee "artifacts/stress-load-${profile}-dry.json"
          done

      - name: Print the private-beta preparation status
        run: |
          set -euo pipefail
          script/gpforum-private-beta-checklist --status | tee artifacts/private-beta-checklist-status.txt
          script/gpforum-evidence-live --status | tee artifacts/evidence-live-status.txt

      - name: Validate the evidence produced by this run
        run: bin/gpforum evidence-validate --strict --human artifacts/*.json

      - name: Validate the archived evidence
        run: script/gpforum-evidence-archive-check

      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpforum-ops-drills-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
