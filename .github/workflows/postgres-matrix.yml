name: PostgreSQL targets

# Migration and PostgreSQL behaviour across every server major GPForum
# supports. ci.yml is the blocking gate on one server; this workflow proves the
# same migration, integration and drill paths on the others.

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'lib/GPForum/Migration/**'
      - 'lib/GPForum/Schema/**'
      - 'lib/GPForum/Schema.pm'
      - 'lib/GPForum/Config.pm'
      - 'lib/GPForum/OS/RuntimeEvidence.pm'
      - 'lib/GPForum/Command/PostgresPerformance.pm'
      - 'lib/GPForum/Query/**'
      - 'lib/GPForum/Infrastructure/SqlFunction*'
      - 'lib/GPForum/Infrastructure/Postgres*'
      - 'lib/GPForum/Infrastructure/EventRecorder.pm'
      - 'lib/GPForum/Infrastructure/AuditRecord.pm'
      - 'lib/GPForum/Service/Forum/**'
      - 'lib/GPForum/Service/Search/**'
      - 'lib/GPForum/Service/Community/**'
      - 'lib/GPForum/Service/Moderation/**'
      - 'lib/GPForum/Service/Outbox/**'
      - 'lib/GPForum/Service/Privacy/**'
      - 'lib/GPForum/Service/Identity/**'
      - 'lib/GPForum/Service/Notification/**'
      - 'lib/GPForum/Service/Attachment/**'
      - 'lib/GPForum/Service/Portability/**'
      - 'lib/GPForum/Service/Admin/**'
      - 'lib/GPForum/Service/Realtime/**'
      - 'lib/GPForum/Service/Operations/**'
      - 'lib/GPForum/Worker/**'
      - 'lib/GPForum/Benchmark/PostgresMetrics.pm'
      - 'lib/GPForum/Benchmark/PlanRules.pm'
      - 'lib/GPForum/Benchmark/QueryPlanEndpoints.pm'
      - 'lib/GPForum/Command/QueryPlanEvidence.pm'
      - 'lib/GPForum/Command/PerformanceSeed.pm'
      - 't/integration/**'
      - 't/lib/GPForum/Test/PgDatabase.pm'
      - 't/lib/GPForum/Test/PostgresHarness.pm'
      - 't/lib/GPForum/Test/OutboxTransport.pm'
      - 't/lib/GPForum/Test/QueryPlanEvidenceDbh.pm'
      - 'lib/GPForum/Command/Migrate.pm'
      - 'lib/GPForum/Command/StagingDrill.pm'
      - 'bin/gpforum'
      - 'script/query-plan-*'
      - 'script/bench-postgres-configuration'
      - 'script/bench-sql-functions'
      - 'script/performance-outbox.pl'
      - 'script/postgres-diagnostics'
      - 'script/lib/GPForum/PostgreSQL/**'
      - 'docs/ops/postgres-diagnostics-schema-v1.json'
      - 'cpanfile'
      - 'cpanfile.postgres'
      - 'cpanfile.snapshot'
      - '.github/actions/setup-gpforum-perl/action.yml'
      - '.github/workflows/postgres-matrix.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'lib/GPForum/Migration/**'
      - 'lib/GPForum/Schema/**'
      - 'lib/GPForum/Schema.pm'
      - 'lib/GPForum/Config.pm'
      - 'lib/GPForum/OS/RuntimeEvidence.pm'
      - 'lib/GPForum/Command/PostgresPerformance.pm'
      - 'lib/GPForum/Query/**'
      - 'lib/GPForum/Infrastructure/SqlFunction*'
      - 'lib/GPForum/Infrastructure/Postgres*'
      - 'lib/GPForum/Infrastructure/EventRecorder.pm'
      - 'lib/GPForum/Infrastructure/AuditRecord.pm'
      - 'lib/GPForum/Service/Forum/**'
      - 'lib/GPForum/Service/Search/**'
      - 'lib/GPForum/Service/Community/**'
      - 'lib/GPForum/Service/Moderation/**'
      - 'lib/GPForum/Service/Outbox/**'
      - 'lib/GPForum/Service/Privacy/**'
      - 'lib/GPForum/Service/Identity/**'
      - 'lib/GPForum/Service/Notification/**'
      - 'lib/GPForum/Service/Attachment/**'
      - 'lib/GPForum/Service/Portability/**'
      - 'lib/GPForum/Service/Admin/**'
      - 'lib/GPForum/Service/Realtime/**'
      - 'lib/GPForum/Service/Operations/**'
      - 'lib/GPForum/Worker/**'
      - 'lib/GPForum/Benchmark/PostgresMetrics.pm'
      - 'lib/GPForum/Benchmark/PlanRules.pm'
      - 'lib/GPForum/Benchmark/QueryPlanEndpoints.pm'
      - 'lib/GPForum/Command/QueryPlanEvidence.pm'
      - 'lib/GPForum/Command/PerformanceSeed.pm'
      - 't/integration/**'
      - 't/lib/GPForum/Test/PgDatabase.pm'
      - 't/lib/GPForum/Test/PostgresHarness.pm'
      - 't/lib/GPForum/Test/OutboxTransport.pm'
      - 't/lib/GPForum/Test/QueryPlanEvidenceDbh.pm'
      - 'lib/GPForum/Command/Migrate.pm'
      - 'lib/GPForum/Command/StagingDrill.pm'
      - 'bin/gpforum'
      - 'script/query-plan-*'
      - 'script/bench-postgres-configuration'
      - 'script/bench-sql-functions'
      - 'script/performance-outbox.pl'
      - 'script/postgres-diagnostics'
      - 'script/lib/GPForum/PostgreSQL/**'
      - 'docs/ops/postgres-diagnostics-schema-v1.json'
      - 'cpanfile'
      - 'cpanfile.postgres'
      - 'cpanfile.snapshot'
      - '.github/actions/setup-gpforum-perl/action.yml'
      - '.github/workflows/postgres-matrix.yml'
  schedule:
    # Nightly, so a server-side change lands as a CI signal and not as a
    # staging surprise.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-matrix-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpforum_test
        volumes:
          - /var/run/postgresql:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U postgres -d gpforum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: /var/run/postgresql
      GPFORUM_DATABASE_DSN: dbi:Pg:dbname=gpforum_test;host=/var/run/postgresql;port=5432
      GPFORUM_DATABASE_USER: postgres
      GPFORUM_DATABASE_PASSWORD: postgres
      # The Perl launcher prepends /usr/bin, so PATH alone cannot pin clients.
      GPFORUM_PG_DUMP: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump
      GPFORUM_PG_RESTORE: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_restore

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GPForum
        uses: ./.github/actions/setup-gpforum-perl
        with:
          postgres: 'true'
          # pg_dump refuses a server newer than itself, and the staging drill
          # dumps and restores.
          postgres-client-version: ${{ matrix.postgres }}

      # These settings belong to this disposable container, never to a live
      # application database. Track nested function statements without putting
      # query text, bind values or production credentials in the evidence.
      - name: Enable statistics on the disposable PostgreSQL service
        timeout-minutes: 2
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          PGPASSWORD: postgres
          PGCONNECT_TIMEOUT: '5'
        run: |
          set -euo pipefail
          psql -U postgres -d gpforum_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart "$POSTGRES_SERVICE_ID"
          ready=false
          for attempt in {1..30}; do
            if pg_isready -U postgres -d gpforum_test >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Disposable PostgreSQL service did not restart after $attempt readiness checks." >&2
            exit 1
          fi
          psql -U postgres -d gpforum_test -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements' \
            -c "ALTER SYSTEM SET pg_stat_statements.track = 'all'" \
            -c "ALTER SYSTEM SET pg_stat_statements.track_planning = 'on'" \
            -c 'SELECT pg_reload_conf()'

      - name: Report server version
        run: psql "user=postgres dbname=gpforum_test" -c 'select version()'
        env:
          PGPASSWORD: postgres

      - name: Print migration plan
        run: bin/gpforum migrate --plan

      - name: Apply database migrations
        id: migrate
        run: bin/gpforum migrate

      - name: Re-apply migrations is a no-op
        run: |
          applied="$(bin/gpforum migrate --quiet)"
          if [ -n "$applied" ]; then
            echo 'migrations are not idempotent; the second migrate re-applied:' >&2
            printf '%s\n' "$applied" >&2
            exit 1
          fi
          echo 'ok: second migrate applied nothing'

      - name: Seed production evidence dataset
        run: bin/gpforum performance-seed --profile small

      # The directory, never a list of files: a list is where a new test goes
      # to never run. t/190-gate-honesty.t holds every workflow to this.
      - name: Run PostgreSQL integration tier
        env:
          # This job owns its disposable PostgreSQL container, including ALTER SYSTEM.
          GPFORUM_POSTGRES_CONTROLLED_TEST: '1'
        run: make integration

      - name: Run platform check
        run: bin/gpforum platform-check --with-db

      - name: Collect read-only PostgreSQL diagnostics
        id: diagnostics
        if: always() && steps.migrate.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p artifacts
          script/gpforum-carton exec script/postgres-diagnostics --json --require-statements \
            | tee "artifacts/postgres-diagnostics-pg${{ matrix.postgres }}.json"

      - name: Validate PostgreSQL diagnostics
        if: always() && steps.diagnostics.outcome != 'skipped'
        run: |
          script/gpforum-carton exec script/postgres-diagnostics --validate \
            "artifacts/postgres-diagnostics-pg${{ matrix.postgres }}.json"
          bin/gpforum evidence-validate --strict --human \
            "artifacts/postgres-diagnostics-pg${{ matrix.postgres }}.json"

      - name: Run fresh/upgrade/dump-restore migration drill
        run: |
          mkdir -p artifacts
          bin/gpforum staging-drill --json \
            | tee "artifacts/staging-drill-pg${{ matrix.postgres }}.json"

      - name: Validate drill evidence
        run: |
          bin/gpforum evidence-validate --strict --human \
            "artifacts/staging-drill-pg${{ matrix.postgres }}.json"

      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpforum-postgres-pg${{ matrix.postgres }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
