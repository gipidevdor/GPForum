 <title id="chart-title">DBIx baseline and PostgreSQL function API service latency</title>
 <desc id="chart-description">Arithmetic means of two recorded per-run direct latency medians, in milliseconds. Create a discussion: DBIx 12.3815, function API 1.581; Reply to a discussion: DBIx 10.996, function API 1.5005; Edit a post: DBIx 11.1195, function API 1.4645; Notification inbox: DBIx 7.5385, function API 1.519; Ranked search: DBIx 20.5905, function API 7.9085; Search autocomplete: DBIx 10.7195, function API 3.556. Service operations only; HTTP routing and template rendering are excluded.</desc>
