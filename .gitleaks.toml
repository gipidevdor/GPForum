# GPForum secret-scanning configuration.
#
# Secrets stay out of the repository (ADR 0059, SECURITY.md): configuration
# is externalized through GPFORUM_* environment variables and /etc/gpforum.
# This file only removes scan paths that never hold repository content and
# fixture strings that exist to prove hashing/redaction behaviour, plus one
# documented PostgreSQL index identifier mistaken for an API key.

title = "GPForum"

[extend]
useDefault = true

[[allowlists]]
description = "Build, coverage and runtime trees are not repository content"
paths = [
  '''^local/''',
  '''^local\.rebuild\.''',
  '''^local\.incomplete\.''',
  '''^cover_db/''',
  '''^var/''',
  '''^artifacts/''',
  '''^\.claude/''',
  '''^\.git/''',
]

[[allowlists]]
description = "Test fixtures carry placeholder hashes and tokens, never credentials"
targetRules = ["generic-api-key"]
paths = [
  '''^t/''',
]

[[allowlists]]
description = "PostgreSQL partition index example in conflict classification documentation"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^lib/GPForum/X/Conflict\.pm$''']
regexTarget = "secret"
regexes = ['''^notifications_2026_10_pkey$''']

[[allowlists]]
description = "Verified SHA-256 file fingerprints in archived benchmark manifests and run metadata"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^benchmarks/http-complete/2026-11-05/source-manifest\.json$''',
  '''^benchmarks/perl-review/2026-11-06-iteration-[2-6]/source-manifest\.json$''',
  '''^benchmarks/perl-review/2026-11-06-iteration-[456]/runs/(?:final-(?:before|after)-[ab]|interrupted-before-a)-(?:http|micro)/run\.json$''',
  '''^benchmarks/perl-review/2026-11-06-iteration-6/runs/excluded-before-b-http-(?:competing-test|after-quiescence|competing-tools)/run\.json$''',
  '''^benchmarks/throughput-regressions/2026-11-06/(?:source-manifest|validation-migrations(?:-initial)?)\.json$''',
]
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']

[[allowlists]]
description = "Scanner-truncated prefix of the archived Credential.pm SHA-256 fingerprint"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^benchmarks/throughput-regressions/2026-11-06/source-manifest\.json$''']
regexTarget = "secret"
regexes = ['''^e6df9ac9ad40c760ce8d8af0ef4ede0d551e49dda643b2e20a1$''']
